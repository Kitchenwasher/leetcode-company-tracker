version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: leettracker_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leetadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leetsecret123}
      POSTGRES_DB: ${POSTGRES_DB:-leettracker}
    ports:
      - "5434:5432" # Uses 5434 on host to avoid conflict with any host postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leetadmin} -d ${POSTGRES_DB:-leettracker}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: leettracker_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-leetadmin}:${POSTGRES_PASSWORD:-leetsecret123}@postgres:5432/${POSTGRES_DB:-leettracker}?schema=public
      JWT_SECRET: ${JWT_SECRET:-super_secret_production_jwt_access_key_32chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super_secret_production_jwt_refresh_key_32chars}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      SMTP_USER: ""
      SMTP_PASS: ""
      EMAIL_FROM: "LeetTracker Pro <no-reply@leettracker.io>"
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_mock_stripe_key_leettracker}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_mock_stripe_webhook_key}
      STRIPE_MOCK_MODE: ${STRIPE_MOCK_MODE:-true}
    ports:
      - "5000:5000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: leettracker_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

  mailpit:
    image: axllent/mailpit:latest
    container_name: leettracker_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Webmail UI for inspecting emails

volumes:
  postgres_data:
